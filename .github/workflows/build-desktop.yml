name: Build Windows and macOS
on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EisenDay-windows-x64
          - os: macos-15
            artifact: EisenDay-macos-arm64
          - os: macos-15-intel
            artifact: EisenDay-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build and test Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./build-combined-windows.ps1
      - name: Build and test macOS
        if: runner.os == 'macOS'
        run: bash ./build-macos.command
      - name: Package macOS executable
        if: runner.os == 'macOS'
        run: tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist EisenDay-macos
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: dist/eisen-day.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error
